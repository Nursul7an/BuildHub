# Развёртывание сервера на Render.
#
# Здесь описано ровно то, что нужно бэкенду: PostgreSQL 16 (ТЗ §3.1),
# постоянный диск под фотографии и секреты, без которых сервер откажется
# стартовать. Фронтенд остаётся на Vercel — см. vercel.json.
#
# Применение: Render → New → Blueprint → указать этот репозиторий.

databases:
  - name: build-hub-db
    databaseName: buildhub
    user: buildhub
    plan: basic-256mb
    postgresMajorVersion: '16'
    # Резервные копии на платном тарифе включены. ТЗ §3.1 требует
    # восстановления на момент времени — на бесплатном его нет.

services:
  - type: web
    name: build-hub-server
    runtime: docker
    dockerfilePath: ./apps/server/Dockerfile
    # Контекст — корень репозитория: рабочие пространства npm ставятся
    # одним деревом по общему package-lock.json.
    dockerContext: .
    plan: starter
    region: frankfurt
    healthCheckPath: /api/health/ready

    # Фотографии отчётов лежат на диске. Без тома они временные и
    # пропадут при первом же перезапуске — а это доказательная база
    # по скрытым работам.
    disk:
      name: uploads
      mountPath: /app/var/uploads
      sizeGB: 10

    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: build-hub-db
          property: connectionString
      # generateValue — случайное значение, созданное Render один раз.
      # Отладочный секрет из репозитория сервер не примет: с ним
      # подделать токен директора может любой, кто видел исходники.
      - key: JWT_SECRET
        generateValue: true
      - key: FILE_SIGNING_SECRET
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true
      - key: FILE_STORAGE_DIR
        value: /app/var/uploads
      - key: LOG_LEVEL
        value: info
      # Адрес фронтенда для CORS. Подставьте домен, выданный Vercel.
      - key: WEB_ORIGIN
        sync: false
